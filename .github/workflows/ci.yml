name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile all modules
        run: python -m compileall -q src tools

      - name: Version banner
        run: python src/harness.py --version

      - name: Judge self-test
        run: python src/judge.py

      - name: Smoke matrix against mock target
        run: >
          python src/harness.py
          --target tare
          --task "smoke test: walk one full chain end to end"
          --probes P01_identity_anchor,P02_contract_precedence,P04_layered_descent
          --mutations identity,b64
          --rounds 2

      - name: Compose a deliverable prompt
        run: python src/compose.py --target tare --task "smoke" --out out/smoke.md

      - name: Assert report and artifacts
        shell: python
        run: |
          import glob, os, sys
          reports = sorted(glob.glob(os.path.join("runs", "*", "report.md")))
          if not reports:
              sys.exit("no report.md generated")
          text = open(reports[-1], encoding="utf-8").read()
          if "探针排行" not in text:
              sys.exit("report missing leaderboard section")
          if not os.path.exists(os.path.join("out", "smoke.md")):
              sys.exit("compose produced no output")
          print(f"ok: {reports[-1]} ({len(text)} chars)")

  build:
    name: build artifacts
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade setuptools wheel

      - name: Build wheel, sdist, portable zip, source zip
        run: python tools/make_artifacts.py

      - name: Verify wheel installs and exposes entry points
        run: |
          python -m venv .verify
          . .verify/bin/activate
          python -m pip install --quiet dist/*.whl
          tare-breaker --version
          tb-compose --help > /dev/null
          python -m tarebreaker --version
          deactivate

      - name: Verify portable zip runs
        run: |
          mkdir -p .portable
          python - <<'PY'
          import zipfile, glob
          z = glob.glob("dist/*-portable.zip")[0]
          zipfile.ZipFile(z).extractall(".portable")
          print("extracted", z)
          PY
          chmod +x .portable/*.sh
          ./.portable/tare-breaker.sh --version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 30
